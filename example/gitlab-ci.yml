stages:
  - run

variables:
  NOTION_TOOLSET_VERSION: "v1.2.3"
  NOTION_TOOLSET_ARCHIVE: "notion-toolset_${NOTION_TOOLSET_VERSION}_linux_amd64.tar.gz"
  NOTION_TOOLSET_URL: "https://github.com/zhuochun/notion-toolset/releases/download/${NOTION_TOOLSET_VERSION}/${NOTION_TOOLSET_ARCHIVE}"

run_daily_journal:
  stage: run
  image: alpine:3.20
  before_script:
    - apk add --no-cache curl tar
    - curl -fsSL "$NOTION_TOOLSET_URL" -o "$NOTION_TOOLSET_ARCHIVE"
    - tar -xzf "$NOTION_TOOLSET_ARCHIVE"
    - chmod +x notion-toolset_*
  script:
    - ./notion-toolset_* --cmd=daily-journal --config=./configs/journal-daily.yaml
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "schedule"
